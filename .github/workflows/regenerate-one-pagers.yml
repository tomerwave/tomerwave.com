name: Regenerate one-pagers

on:
  push:
    branches: [feat/signup-attribution]
    paths:
      - ".github/workflows/regenerate-one-pagers.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/signup-attribution

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run one-pagers -- --build

      - name: Commit generated sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/one-pagers scripts/one-pagers.lock.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: refresh service one-pagers"
          git push origin HEAD:feat/signup-attribution
