name: Letter Publish Red Green

on:
  push:
    branches: [feat/letter-publishing]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run letter:publish -- --service=ai-automation --issue=1
