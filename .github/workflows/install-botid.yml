name: Install BotID dependency

on:
  push:
    branches: [feat/analytics-hardening]
    paths:
      - ".github/workflows/install-botid.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/analytics-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install botid@1.5.11 --save
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git commit -m "feat/security: add BotID"
          git push origin HEAD:feat/analytics-hardening
